<svg xmlns="http://www.w3.org/2000/svg" width="850" height="360" viewBox="0 0 850 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="50%" style="stop-color:#0d1420"/>
      <stop offset="100%" style="stop-color:#080c14"/>
    </linearGradient>
    <radialGradient id="glow-center" cx="50%" cy="10%" r="60%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0"/>
    </radialGradient>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="d"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="motto-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1420"/>
      <stop offset="50%" style="stop-color:#152233"/>
      <stop offset="100%" style="stop-color:#0d1420"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes shimmer { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    @keyframes dotPulse { 0%,100%{r:1.5;opacity:0.3} 50%{r:2.5;opacity:0.8} }

    .fade-0{animation:fadeUp 0.6s ease-out 0.1s both}
    .fade-1{animation:fadeUp 0.6s ease-out 0.3s both}
    .fade-2{animation:fadeUp 0.5s ease-out 0.55s both}
    .fade-3{animation:fadeUp 0.5s ease-out 0.75s both}
    .fade-4{animation:fadeUp 0.5s ease-out 0.95s both}
    .fade-5{animation:fadeUp 0.5s ease-out 1.15s both}
    .fade-6{animation:fadeUp 0.6s ease-out 1.4s both}
    .accent-shimmer{animation:shimmer 3s ease-in-out infinite}
    .cursor{animation:blink 1.1s step-end infinite}
    .icon-1{animation:float 4s ease-in-out infinite}
    .icon-2{animation:float 4s ease-in-out 0.6s infinite}
    .icon-3{animation:float 4s ease-in-out 1.2s infinite}
    .icon-4{animation:float 4s ease-in-out 1.8s infinite}
    .ambient{animation:dotPulse 3s ease-in-out infinite}
    .ambient2{animation:dotPulse 4s ease-in-out 1s infinite}

    .eyebrow{fill:#22d3ee;font-family:'Segoe UI',monospace;font-size:11px;font-weight:700;letter-spacing:3px}
    .headline{fill:#ffffff;font-family:'Segoe UI','Helvetica Neue',sans-serif;font-size:24px;font-weight:700}
    .trait-title{fill:#e6edf3;font-family:'Segoe UI',sans-serif;font-size:13px;font-weight:700}
    .trait-desc{fill:#8b949e;font-family:'Segoe UI',sans-serif;font-size:10.5px}
    .motto-label{fill:#8b949e;font-family:'Segoe UI',monospace;font-size:10px;font-weight:600;letter-spacing:2px}
    .motto-text{fill:#ffffff;font-family:'Segoe UI','Helvetica Neue',sans-serif;font-size:20px;font-weight:700;font-style:italic}
  </style>

  <!-- Background -->
  <rect fill="url(#bg)" width="850" height="360" rx="16"/>
  <rect fill="url(#glow-center)" width="850" height="360" rx="16"/>
  <rect fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1" x="1" y="1" width="848" height="358" rx="16"/>

  <!-- Ambient particles -->
  <circle class="ambient" cx="60" cy="50" r="1.5" fill="#22d3ee"/>
  <circle class="ambient2" cx="790" cy="60" r="1.5" fill="#bc8cff"/>
  <circle class="ambient" cx="800" cy="320" r="1.5" fill="#3fb950"/>
  <circle class="ambient2" cx="40" cy="310" r="1.5" fill="#f0883e"/>

  <!-- Header -->
  <g class="fade-0">
    <text class="eyebrow" x="425" y="46" text-anchor="middle">WHO'S THIS GUY ANYWAY</text>
  </g>
  <g class="fade-1" filter="url(#text-glow)">
    <text class="headline" x="425" y="78" text-anchor="middle">An explorer — not just in tech, but in life.</text>
  </g>

  <!-- Trait cards -->
  <g class="fade-2 icon-1">
    <rect fill="#0d1117" x="44" y="112" width="182" height="92" rx="12" opacity="0.6"/>
    <rect fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1" x="44" y="112" width="182" height="92" rx="12"/>
    <circle cx="76" cy="144" r="16" fill="#22d3ee" opacity="0.15"/>
    <text x="68" y="150" font-size="18">🧠</text>
    <text class="trait-title" x="100" y="140">Deep Thinker</text>
    <text class="trait-desc" x="64" y="172">Likes to sit with a problem</text>
    <text class="trait-desc" x="64" y="186">until it actually makes sense.</text>
  </g>

  <g class="fade-3 icon-2">
    <rect fill="#0d1117" x="238" y="112" width="182" height="92" rx="12" opacity="0.6"/>
    <rect fill="none" stroke="#bc8cff" stroke-opacity="0.25" stroke-width="1" x="238" y="112" width="182" height="92" rx="12"/>
    <circle cx="270" cy="144" r="16" fill="#bc8cff" opacity="0.15"/>
    <text x="262" y="150" font-size="18">🖥️</text>
    <text class="trait-title" x="294" y="140">Full-Stack Builder</text>
    <text class="trait-desc" x="258" y="172">Designs and ships systems</text>
    <text class="trait-desc" x="258" y="186">end to end, not just demos.</text>
  </g>

  <g class="fade-4 icon-3">
    <rect fill="#0d1117" x="432" y="112" width="182" height="92" rx="12" opacity="0.6"/>
    <rect fill="none" stroke="#f0883e" stroke-opacity="0.25" stroke-width="1" x="432" y="112" width="182" height="92" rx="12"/>
    <circle cx="464" cy="144" r="16" fill="#f0883e" opacity="0.15"/>
    <text x="456" y="150" font-size="18">📚</text>
    <text class="trait-title" x="488" y="140">Curious Reader</text>
    <text class="trait-desc" x="452" y="172">Books first, hot takes</text>
    <text class="trait-desc" x="452" y="186">second — perspective matters.</text>
  </g>

  <g class="fade-5 icon-4">
    <rect fill="#0d1117" x="626" y="112" width="180" height="92" rx="12" opacity="0.6"/>
    <rect fill="none" stroke="#3fb950" stroke-opacity="0.25" stroke-width="1" x="626" y="112" width="180" height="92" rx="12"/>
    <circle cx="658" cy="144" r="16" fill="#3fb950" opacity="0.15"/>
    <text x="650" y="150" font-size="18">🏍️</text>
    <text class="trait-title" x="682" y="140">Moto-Rider</text>
    <text class="trait-desc" x="646" y="172">Because sometimes you just</text>
    <text class="trait-desc" x="646" y="186">need the open road, too.</text>
  </g>

  <!-- Motto banner -->
  <g class="fade-6">
    <rect fill="url(#motto-grad)" x="44" y="232" width="762" height="94" rx="14" filter="url(#card-shadow)"/>
    <rect fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1" x="44" y="232" width="762" height="94" rx="14"/>
    <rect class="accent-shimmer" fill="url(#accent-line)" x="44" y="232" width="762" height="2" rx="1"/>

    <text class="motto-label" x="425" y="264" text-anchor="middle">🏴‍☠️ MY MOTTO 🗺️</text>
    <text class="motto-text" x="401" y="298" text-anchor="middle">"Let's Build Another World"</text>
    <rect class="cursor" x="656" y="284" width="8" height="16" fill="#22d3ee" rx="1"/>
  </g>
</svg>
