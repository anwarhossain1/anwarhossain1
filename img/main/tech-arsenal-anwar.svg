<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#030610"/><stop offset="60%" style="stop-color:#081020"/><stop offset="100%" style="stop-color:#0c1a30"/>
    </linearGradient>
    <linearGradient id="ground-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1a2c"/><stop offset="100%" style="stop-color:#0a1220"/>
    </linearGradient>
    <linearGradient id="under" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#080d18"/><stop offset="100%" style="stop-color:#040710"/>
    </linearGradient>
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/><stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.5"/><stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="gl"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#58a6ff" flood-opacity="0.15"/></filter>
    <filter id="cbl"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <style>
    @keyframes rise { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes cloudFloat { 0%,100%{transform:translate(0,0)} 50%{transform:translate(10px,-3px)} }
    @keyframes cloudFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-8px,2px)} }
    @keyframes winFlicker { 0%{opacity:0.15} 20%{opacity:0.7} 40%{opacity:0.2} 60%{opacity:0.8} 80%{opacity:0.1} 100%{opacity:0.5} }
    @keyframes winFlicker2 { 0%{opacity:0.4} 25%{opacity:0.1} 50%{opacity:0.6} 75%{opacity:0.3} 100%{opacity:0.7} }
    @keyframes starTwinkle { 0%,100%{opacity:0.15} 50%{opacity:0.8} }
    @keyframes groundGlow { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
    @keyframes underReveal { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes antennaPulse { 0%,100%{opacity:0.4;r:2} 50%{opacity:1;r:3.5} }
    @keyframes signal { 0%{r:3;opacity:0.5} 100%{r:14;opacity:0} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .r1{animation:rise 0.8s ease-out 0.3s both}
    .r2{animation:rise 0.8s ease-out 0.45s both}
    .r3{animation:rise 0.8s ease-out 0.6s both}
    .r4{animation:rise 0.8s ease-out 0.75s both}
    .r5{animation:rise 0.8s ease-out 0.9s both}
    .r6{animation:rise 0.8s ease-out 1.05s both}
    .r7{animation:rise 0.8s ease-out 1.2s both}
    .cf1{animation:cloudFloat 10s ease-in-out infinite}
    .cf2{animation:cloudFloat2 12s ease-in-out infinite}
    .cf3{animation:cloudFloat 14s ease-in-out 1s infinite}
    .wf{animation:winFlicker 4s ease-in-out infinite}
    .wf2{animation:winFlicker2 5s ease-in-out 1s infinite}
    .wf3{animation:winFlicker 3.5s ease-in-out 2s infinite}
    .st{animation:starTwinkle 3s ease-in-out infinite}
    .st2{animation:starTwinkle 4.5s ease-in-out 1s infinite}
    .st3{animation:starTwinkle 5s ease-in-out 2s infinite}
    .gg{animation:groundGlow 3s ease-in-out infinite}
    .ur1{animation:underReveal 0.6s ease-out 1.5s both}
    .ur2{animation:underReveal 0.6s ease-out 1.7s both}
    .ur3{animation:underReveal 0.6s ease-out 1.9s both}
    .ur4{animation:underReveal 0.6s ease-out 2.1s both}
    .ap{animation:antennaPulse 2s ease-in-out infinite}
    .sig{animation:signal 2s ease-out infinite}
    .fi{animation:fadeIn 0.4s ease-out 0.1s both}

    .lbl{fill:#fff;font-family:'Segoe UI',sans-serif;font-size:8.5px;font-weight:700;text-anchor:middle}
    .clbl{fill:#fff;font-family:'Segoe UI',sans-serif;font-size:8px;font-weight:700;text-anchor:middle}
    .slbl{fill:#8b949e;font-family:'Segoe UI',monospace;font-size:7.5px;font-weight:600;letter-spacing:2px}
    .title{fill:#fff;font-family:'Segoe UI',sans-serif;font-size:12px;font-weight:800;text-anchor:middle;letter-spacing:1px}
    .dlbl{fill:#fff;font-family:'Segoe UI',sans-serif;font-size:8px;font-weight:700;text-anchor:middle}
  </style>

  <!-- ═══ SKY ═══ -->
  <rect fill="url(#sky)" width="600" height="660"/>

  <!-- Stars -->
  <circle class="st" cx="45" cy="20" r="0.8" fill="#fff"/>
  <circle class="st2" cx="130" cy="40" r="0.6" fill="#fff"/>
  <circle class="st3" cx="250" cy="15" r="0.8" fill="#fff"/>
  <circle class="st" cx="380" cy="30" r="0.6" fill="#fff"/>
  <circle class="st2" cx="490" cy="18" r="0.8" fill="#fff"/>
  <circle class="st3" cx="560" cy="42" r="0.6" fill="#fff"/>
  <circle class="st" cx="80" cy="58" r="0.5" fill="#fff"/>
  <circle class="st2" cx="320" cy="50" r="0.5" fill="#fff"/>
  <circle class="st3" cx="530" cy="65" r="0.5" fill="#fff"/>

  <!-- Title -->
  <g class="fi">
    <text class="title" x="300" y="18">⚔️ TECH ARSENAL</text>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ☁️ CLOUD & TOOLING — floating isometric     -->
  <!-- ═══════════════════════════════════════════ -->
  <g class="fi"><text class="slbl" x="12" y="45">☁ CLOUD &amp; TOOLING</text></g>

  <!-- Docker — isometric floating platform -->
  <g class="cf1" filter="url(#sh)">
    <!-- Top face (diamond) -->
    <polygon points="90,72 140,54 190,72 140,90" fill="#2496ed" opacity="0.12"/>
    <polygon points="90,72 140,54 190,72 140,90" fill="none" stroke="#2496ed" stroke-width="0.9" stroke-opacity="0.55"/>
    <!-- Left face (thin) -->
    <polygon points="90,72 140,90 140,98 90,80" fill="#1c78c0" opacity="0.15"/>
    <!-- Right face (thin) -->
    <polygon points="190,72 140,90 140,98 190,80" fill="#1f86d6" opacity="0.12"/>
    <text class="clbl" x="140" y="80" fill="#2496ed">Docker</text>
  </g>

  <!-- VPS -->
  <g class="cf3" filter="url(#sh)">
    <polygon points="250,62 300,44 350,62 300,80" fill="#2dd4bf" opacity="0.12"/>
    <polygon points="250,62 300,44 350,62 300,80" fill="none" stroke="#2dd4bf" stroke-width="0.9" stroke-opacity="0.55"/>
    <polygon points="250,62 300,80 300,88 250,70" fill="#1d9e8f" opacity="0.15"/>
    <polygon points="350,62 300,80 300,88 350,70" fill="#25b8a6" opacity="0.12"/>
    <text class="clbl" x="300" y="70" fill="#2dd4bf">VPS</text>
  </g>

  <!-- Git -->
  <g class="cf2" filter="url(#sh)">
    <polygon points="410,78 460,60 510,78 460,96" fill="#f05032" opacity="0.12"/>
    <polygon points="410,78 460,60 510,78 460,96" fill="none" stroke="#f05032" stroke-width="0.9" stroke-opacity="0.55"/>
    <polygon points="410,78 460,96 460,104 410,86" fill="#c04028" opacity="0.15"/>
    <polygon points="510,78 460,96 460,104 510,86" fill="#d8482e" opacity="0.12"/>
    <text class="clbl" x="460" y="86" fill="#f05032">Git</text>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- 🏙️ ISOMETRIC BUILDINGS — Back row first    -->
  <!-- ═══════════════════════════════════════════ -->
  <g class="fi"><text class="slbl" x="12" y="140">🏗 LANGUAGES</text></g>

  <!-- *** BACK ROW *** -->

  <!-- JAVASCRIPT — tallest (cx=135, cy=205, s=28, h=120) -->
  <g class="r1" filter="url(#sh)">
    <!-- Top face -->
    <polygon points="135,191 163,205 135,219 107,205" fill="#f7df1e"/>
    <!-- Left face -->
    <polygon points="107,205 135,219 135,339 107,325" fill="#8a7c0c"/>
    <!-- Right face -->
    <polygon points="163,205 135,219 135,339 163,325" fill="#b8a413"/>
    <!-- Windows left face -->
    <rect class="wf" x="112" y="220" width="5" height="5" fill="#fffbe6" opacity="0.4" rx="0.5" transform="skewY(26)"/>
    <rect class="wf2" x="112" y="240" width="5" height="5" fill="#fffbe6" opacity="0.3" rx="0.5" transform="skewY(26)"/>
    <rect class="wf3" x="112" y="260" width="5" height="5" fill="#fffbe6" opacity="0.5" rx="0.5" transform="skewY(26)"/>
    <rect class="wf" x="120" y="220" width="5" height="5" fill="#fffbe6" opacity="0.3" rx="0.5" transform="skewY(26)"/>
    <rect class="wf2" x="120" y="240" width="5" height="5" fill="#fffbe6" opacity="0.6" rx="0.5" transform="skewY(26)"/>
    <rect class="wf3" x="120" y="260" width="5" height="5" fill="#fffbe6" opacity="0.2" rx="0.5" transform="skewY(26)"/>
    <!-- Windows right face -->
    <rect class="wf2" x="142" y="236" width="5" height="5" fill="#fffbe6" opacity="0.4" rx="0.5" transform="skewY(-26)"/>
    <rect class="wf" x="142" y="256" width="5" height="5" fill="#fffbe6" opacity="0.5" rx="0.5" transform="skewY(-26)"/>
    <rect class="wf3" x="150" y="236" width="5" height="5" fill="#fffbe6" opacity="0.3" rx="0.5" transform="skewY(-26)"/>
    <rect class="wf2" x="150" y="256" width="5" height="5" fill="#fffbe6" opacity="0.6" rx="0.5" transform="skewY(-26)"/>
    <!-- Antenna -->
    <line x1="135" y1="191" x2="135" y2="170" stroke="#58a6ff" stroke-width="1"/>
    <circle class="ap" cx="135" cy="168" r="2.5" fill="#58a6ff"/>
    <circle class="sig" cx="135" cy="168" r="4" fill="none" stroke="#58a6ff" stroke-width="0.5"/>
    <text x="135" y="161" fill="#6e7681" font-family="'Segoe UI',monospace" font-size="6" text-anchor="middle">🌐 WEB</text>
    <!-- Label -->
    <text class="lbl" x="135" y="353" fill="#fde68a">JAVASCRIPT</text>
  </g>

  <!-- TYPESCRIPT (cx=225, cy=200, s=25, h=100) -->
  <g class="r2" filter="url(#sh)">
    <polygon points="225,188 250,200 225,212 200,200" fill="#3178c6"/>
    <polygon points="200,200 225,212 225,312 200,300" fill="#1c4576"/>
    <polygon points="250,200 225,212 225,312 250,300" fill="#24569a"/>
    <rect class="wf3" x="205" y="218" width="5" height="5" fill="#fde68a" opacity="0.4" rx="0.5" transform="skewY(26)"/>
    <rect class="wf" x="205" y="238" width="5" height="5" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(26)"/>
    <rect class="wf2" x="213" y="218" width="5" height="5" fill="#fde68a" opacity="0.5" rx="0.5" transform="skewY(26)"/>
    <rect class="wf3" x="213" y="238" width="5" height="5" fill="#fde68a" opacity="0.2" rx="0.5" transform="skewY(26)"/>
    <rect class="wf" x="232" y="228" width="5" height="5" fill="#fde68a" opacity="0.4" rx="0.5" transform="skewY(-26)"/>
    <rect class="wf2" x="232" y="248" width="5" height="5" fill="#fde68a" opacity="0.5" rx="0.5" transform="skewY(-26)"/>
    <rect class="wf3" x="240" y="228" width="5" height="5" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(-26)"/>
    <text class="lbl" x="225" y="326" fill="#93c5fd">TYPESCRIPT</text>
  </g>

  <!-- JAVA (cx=310, cy=205, s=24, h=90) -->
  <g class="r3" filter="url(#sh)">
    <polygon points="310,193 334,205 310,217 286,205" fill="#e76f00"/>
    <polygon points="286,205 310,217 310,307 286,295" fill="#8a4200"/>
    <polygon points="334,205 310,217 310,307 334,295" fill="#b85800"/>
    <rect class="wf2" x="291" y="222" width="5" height="5" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(26)"/>
    <rect class="wf" x="291" y="242" width="5" height="5" fill="#fde68a" opacity="0.5" rx="0.5" transform="skewY(26)"/>
    <rect class="wf3" x="299" y="222" width="5" height="5" fill="#fde68a" opacity="0.4" rx="0.5" transform="skewY(26)"/>
    <rect class="wf" x="316" y="232" width="5" height="5" fill="#fde68a" opacity="0.5" rx="0.5" transform="skewY(-26)"/>
    <rect class="wf2" x="316" y="252" width="5" height="5" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(-26)"/>
    <text class="lbl" x="310" y="321" fill="#fdba74">JAVA</text>
  </g>

  <!-- C (cx=390, cy=210, s=22, h=75) -->
  <g class="r3" filter="url(#sh)">
    <polygon points="390,199 412,210 390,221 368,210" fill="#a8b9cc"/>
    <polygon points="368,210 390,221 390,296 368,285" fill="#5a6673"/>
    <polygon points="412,210 390,221 390,296 412,285" fill="#78889a"/>
    <rect class="wf" x="373" y="228" width="4" height="4" fill="#fde68a" opacity="0.4" rx="0.5" transform="skewY(26)"/>
    <rect class="wf3" x="373" y="245" width="4" height="4" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(26)"/>
    <rect class="wf2" x="396" y="238" width="4" height="4" fill="#fde68a" opacity="0.5" rx="0.5" transform="skewY(-26)"/>
    <text class="lbl" x="390" y="310" fill="#cbd5e1">C</text>
  </g>

  <!-- *** FRONT ROW — Frameworks *** -->
  <g class="fi"><text class="slbl" x="12" y="375">🔧 FRAMEWORKS</text></g>

  <!-- REACT (cx=180, cy=390, s=22, h=70) -->
  <g class="r4" filter="url(#sh)">
    <polygon points="180,379 202,390 180,401 158,390" fill="#087ea4"/>
    <polygon points="158,390 180,401 180,471 158,460" fill="#054f68"/>
    <polygon points="202,390 180,401 180,471 202,460" fill="#066a8a"/>
    <rect class="wf3" x="163" y="408" width="4" height="4" fill="#fde68a" opacity="0.4" rx="0.5" transform="skewY(26)"/>
    <rect class="wf" x="163" y="425" width="4" height="4" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(26)"/>
    <rect class="wf2" x="186" y="418" width="4" height="4" fill="#fde68a" opacity="0.5" rx="0.5" transform="skewY(-26)"/>
    <text class="lbl" x="180" y="485" fill="#61dafb">REACT</text>
  </g>

  <!-- NEXT.JS (cx=260, cy=395, s=22, h=65) -->
  <g class="r5" filter="url(#sh)">
    <polygon points="260,384 282,395 260,406 238,395" fill="#e5e7eb"/>
    <polygon points="238,395 260,406 260,471 238,460" fill="#1f2937"/>
    <polygon points="282,395 260,406 260,471 282,460" fill="#374151"/>
    <rect class="wf" x="243" y="413" width="4" height="4" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(26)"/>
    <rect class="wf2" x="243" y="430" width="4" height="4" fill="#fde68a" opacity="0.5" rx="0.5" transform="skewY(26)"/>
    <rect class="wf3" x="266" y="423" width="4" height="4" fill="#fde68a" opacity="0.4" rx="0.5" transform="skewY(-26)"/>
    <text class="lbl" x="260" y="485" fill="#e5e7eb">NEXT.JS</text>
  </g>

  <!-- NODE (cx=335, cy=398, s=20, h=58) -->
  <g class="r6" filter="url(#sh)">
    <polygon points="335,388 355,398 335,408 315,398" fill="#3c873a"/>
    <polygon points="315,398 335,408 335,466 315,456" fill="#275226"/>
    <polygon points="355,398 335,408 335,466 355,456" fill="#306c2e"/>
    <rect class="wf2" x="320" y="415" width="4" height="4" fill="#fde68a" opacity="0.4" rx="0.5" transform="skewY(26)"/>
    <rect class="wf3" x="341" y="423" width="4" height="4" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(-26)"/>
    <text class="lbl" x="335" y="480" fill="#68d96a">NODE.JS</text>
  </g>

  <!-- SPRING BOOT (cx=420, cy=402, s=20, h=50) -->
  <g class="r7" filter="url(#sh)">
    <polygon points="420,392 440,402 420,412 400,402" fill="#6db33f"/>
    <polygon points="400,402 420,412 420,462 400,452" fill="#426a26"/>
    <polygon points="440,402 420,412 420,462 440,452" fill="#548d32"/>
    <rect class="wf" x="405" y="420" width="4" height="4" fill="#fde68a" opacity="0.3" rx="0.5" transform="skewY(26)"/>
    <rect class="wf2" x="426" y="428" width="4" height="4" fill="#fde68a" opacity="0.5" rx="0.5" transform="skewY(-26)"/>
    <text class="lbl" x="420" y="476" fill="#86d65a">SPRING BOOT</text>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- GROUND LINE                                -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Isometric ground plane -->
  <polygon points="0,500 300,430 600,500 300,570" fill="url(#ground-top)" opacity="0.3"/>
  <rect class="gg" fill="url(#glow-line)" x="0" y="498" width="600" height="2"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- 🗄️ UNDERGROUND — Databases                 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect fill="url(#under)" x="0" y="500" width="600" height="160"/>
  <line x1="0" y1="530" x2="600" y2="530" stroke="#0e1520" stroke-width="0.5"/>
  <line x1="0" y1="560" x2="600" y2="560" stroke="#0c1218" stroke-width="0.5"/>
  <line x1="0" y1="590" x2="600" y2="590" stroke="#0a1016" stroke-width="0.5"/>

  <g class="fi"><text class="slbl" x="12" y="522">🗄 DATA LAYER</text></g>

  <!-- PostgreSQL — isometric cylinder -->
  <g class="ur1">
    <polygon points="100,540 140,528 180,540 140,552" fill="#336791" opacity="0.5"/>
    <polygon points="100,540 140,552 140,582 100,570" fill="#1d3c55" opacity="0.6"/>
    <polygon points="180,540 140,552 140,582 180,570" fill="#265070" opacity="0.5"/>
    <polygon points="100,570 140,582 180,570 140,558" fill="#336791" opacity="0.3"/>
    <text class="dlbl" x="140" y="566" fill="#93c5fd">PostgreSQL</text>
    <line x1="140" y1="528" x2="140" y2="500" stroke="#336791" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.3"/>
  </g>

  <!-- MongoDB -->
  <g class="ur2">
    <polygon points="210,545 250,533 290,545 250,557" fill="#47a248" opacity="0.5"/>
    <polygon points="210,545 250,557 250,587 210,575" fill="#2a6129" opacity="0.6"/>
    <polygon points="290,545 250,557 250,587 290,575" fill="#378238" opacity="0.5"/>
    <polygon points="210,575 250,587 290,575 250,563" fill="#47a248" opacity="0.3"/>
    <text class="dlbl" x="250" y="571" fill="#86efac">MongoDB</text>
    <line x1="250" y1="533" x2="250" y2="500" stroke="#47a248" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.3"/>
  </g>

  <!-- Redis -->
  <g class="ur3">
    <polygon points="320,540 360,528 400,540 360,552" fill="#d82c20" opacity="0.5"/>
    <polygon points="320,540 360,552 360,582 320,570" fill="#811a14" opacity="0.6"/>
    <polygon points="400,540 360,552 360,582 400,570" fill="#a82118" opacity="0.5"/>
    <polygon points="320,570 360,582 400,570 360,558" fill="#d82c20" opacity="0.3"/>
    <text class="dlbl" x="360" y="566" fill="#fca5a5">Redis</text>
    <line x1="360" y1="528" x2="360" y2="500" stroke="#d82c20" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.3"/>
  </g>

  <!-- MySQL -->
  <g class="ur4">
    <polygon points="430,545 470,533 510,545 470,557" fill="#00758f" opacity="0.5"/>
    <polygon points="430,545 470,557 470,587 430,575" fill="#004557" opacity="0.6"/>
    <polygon points="510,545 470,557 470,587 510,575" fill="#005d75" opacity="0.5"/>
    <polygon points="430,575 470,587 510,575 470,563" fill="#00758f" opacity="0.3"/>
    <text class="dlbl" x="470" y="571" fill="#67e8f9">MySQL</text>
    <line x1="470" y1="533" x2="470" y2="500" stroke="#00758f" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.3"/>
  </g>

  <!-- Footer -->
  <text x="300" y="625" text-anchor="middle" fill="#4a5568" font-family="'Segoe UI',sans-serif" font-size="7.5">Every tool battle-tested in production</text>
</svg>
